name: Update results

# Hourly job that refreshes scorers + highlight links and the committed base
# public/data/live.json. Near-real-time LIVE SCORES are handled separately by the
# Cloudflare Worker (worker/), which the app reads directly — so this job no longer
# needs a fast cadence (GitHub's scheduler is unreliable at minute granularity anyway).
# The Worker merges this base's scorers + highlights with fresh scores from football-data.
#
# YouTube highlight searches run at the top of the hour (see enrichHighlights).

on:
  schedule:
    - cron: '0 * * * *'  # hourly (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMP: ${{ vars.FOOTBALL_DATA_COMP }}
          FOOTBALL_DATA_SEASON: ${{ vars.FOOTBALL_DATA_SEASON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update_results.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/live.json; then
            echo "No changes."
          else
            git add public/data/live.json
            git commit -m "chore: update results $(date -u +%FT%TZ)"
            git push
          fi
