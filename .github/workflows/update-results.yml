name: Update results

# Backup/base refresher only. The Cloudflare Worker (worker/) is now the live backend:
# it serves fresh scores + scorers from football-data and owns YouTube highlights (via
# its own reliable cron + KV). This job just refreshes the committed public/data/live.json
# that the Worker falls back to if football-data is briefly unavailable. It deliberately
# does NOT set YOUTUBE_API_KEY (the Worker owns highlights), so there's no quota conflict.
#
# Kept mostly for manual runs; GitHub's scheduler is unreliable, which is exactly why
# live data moved to the Worker.

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6h (best-effort base refresh; Worker is primary)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMP: ${{ vars.FOOTBALL_DATA_COMP }}
          FOOTBALL_DATA_SEASON: ${{ vars.FOOTBALL_DATA_SEASON }}
          # No YOUTUBE_API_KEY here on purpose — the Cloudflare Worker owns highlights.
        run: node scripts/update_results.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/live.json; then
            echo "No changes."
          else
            git add public/data/live.json
            git commit -m "chore: update results $(date -u +%FT%TZ)"
            git push
          fi
