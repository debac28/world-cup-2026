name: Update results

# Pulls scores + top scorers from football-data.org and commits public/data/live.json.
# The app reads live.json directly from raw GitHub, so each commit reaches users without
# a redeploy. (Public repo => GitHub Actions minutes are free.)
#
# Frequency is matched to when matches are actually live. Derived from the fixtures
# (kickoff .. +2.5h, in UTC): matches occur during UTC hours 16-23 and 00-06; UTC
# 07-15 has no matches. So we poll every 5 min during match hours and hourly otherwise.
#
# YouTube highlight searches are throttled to the top of each hour inside the script
# (see enrichHighlights) so the 5-min cadence stays within YouTube's free quota.

on:
  schedule:
    - cron: '*/5 16-23 * * *'  # match hours (UTC): every 5 min
    - cron: '*/5 0-6 * * *'    # match hours (UTC, late Americas night): every 5 min
    - cron: '0 7-15 * * *'     # quiet hours (UTC): hourly
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMP: ${{ vars.FOOTBALL_DATA_COMP }}
          FOOTBALL_DATA_SEASON: ${{ vars.FOOTBALL_DATA_SEASON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update_results.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/live.json; then
            echo "No changes."
          else
            git add public/data/live.json
            git commit -m "chore: update results $(date -u +%FT%TZ)"
            git push
          fi
