name: Update results

# Every-5-minutes job that pulls scores + top scorers from football-data.org and commits
# the refreshed public/data/live.json. The app reads live.json directly from raw GitHub,
# so each commit reaches users without a redeploy.
#
# Quota notes (football-data free tier = 10 calls/min): 2 calls/run x 288 runs/day.
# YouTube highlight searches are throttled to ~once/hour inside the script (see
# enrichHighlights) so the 5-min cadence stays within YouTube's free quota.

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (UTC); GitHub may delay a few minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMP: ${{ vars.FOOTBALL_DATA_COMP }}
          FOOTBALL_DATA_SEASON: ${{ vars.FOOTBALL_DATA_SEASON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update_results.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/live.json; then
            echo "No changes."
          else
            git add public/data/live.json
            git commit -m "chore: update results $(date -u +%FT%TZ)"
            git push
          fi
