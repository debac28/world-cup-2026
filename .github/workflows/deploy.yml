name: Deploy

# Builds the PWA and publishes it to GitHub Pages. Runs on code changes and manual
# dispatch only. The every-5-minutes results commits do NOT redeploy: the app reads
# live.json directly from raw GitHub, so data refreshes need no rebuild. We ignore
# live.json so a data commit never triggers a deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/live.json'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Served at the root of the custom domain (fifa2026.scoreit.fyi via public/CNAME),
          # so the base path is '/', not /<repo>/.
          BASE_PATH: /
          # Cloudflare Worker URL the app reads live scores from (repo variable).
          VITE_LIVE_URL: ${{ vars.VITE_LIVE_URL }}
          # Cloudflare Web Analytics site token (repo variable). Beacon is skipped when unset.
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v5
