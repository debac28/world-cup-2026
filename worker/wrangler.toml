name = "worldcup26-live"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The Worker is the live backend: GET /live serves fresh scores+scorers (football-data)
# merged with highlight links from KV, cached ~60s. The hourly cron searches YouTube for
# finished matches missing highlights and stores them in KV — replacing GitHub's
# unreliable scheduler.
#
# Secrets (set via wrangler, not committed):
#   npx wrangler secret put FOOTBALL_DATA_TOKEN -c worker/wrangler.toml
#   npx wrangler secret put YOUTUBE_API_KEY     -c worker/wrangler.toml

[triggers]
crons = ["0 * * * *"] # hourly highlight search (Cloudflare crons are reliable)

# KV store persisting found highlights ({ matchId: { US: {...} } }).
[[kv_namespaces]]
binding = "KV"
id = "b8acddfd78234223abe64a27adaa4a7f"

[vars]
# Fallback source if football-data is briefly unavailable.
BASE_LIVE_URL = "https://raw.githubusercontent.com/debac28/world-cup-2026/main/public/data/live.json"
